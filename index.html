{n:"Unit 1: Basics & Test Construction",
notes:[
["What is a Psychological Test?",["Anastasi & Urbina (1997): essentially an objective and standardized measure of a sample of behaviour.","Kaplan & Saccuzzo (2001): a set of items designed to measure characteristics of human beings that pertain to behaviour.","Purpose is twofold: (1) compare the same individual on two or more aspects of a trait; (2) compare two or more individuals on the same trait.","Measurement can be quantitative or qualitative.","Items are arranged in a sequence and based on principles of test construction.","It rests on a limited sample of behaviour, and scores are interpreted against a standardized sample."],"<b>History:</b> Chinese testing around 2200 BC; British East India Company 1832; civil services 1855.<br><b>Misconceptions:</b> tests are not only for abnormal people, not only for smart people, are not necessarily difficult, a random newspaper quiz is not psychological testing, and a psychologist cannot read your mind from a test."],
["Characteristics of a Good Test",["Objectivity: free from subjective element (scoring does not depend on the scorer).","Reliability: gives consistent scores.","Validity: measures what it claims to measure.","Norms: allow meaningful interpretation of scores.","Practicability: easy to administer, score and afford."],"<div class='tip'>Memory trick: O-R-V-N-P = Obedient Rabbits Value Nice Parks.</div><b>Writing tip:</b> in the exam give one definition, one line plus one example for each characteristic."],
["General Steps in Test Construction",["Step 1: Planning the test (purpose, population, content, format).","Step 2: Writing items.","Step 3: Preliminary administration / experimental try-out.","Step 4: Reliability of the final test.","Step 5: Validity of the final test.","Step 6: Preparation of norms.","Step 7: Preparation of manual and reproduction of the test."],"<b>Reliability step:</b> final test given to a fresh sample (N=100); methods include test-retest, split-half, Alpha, KR.<br><b>Validity step:</b> content, criterion, construct; computed with correlation, chi-square etc.<br><b>Norms:</b> age norms, grade norms, percentile norms, standard scores, prepared on the true population.<br><b>Manual:</b> technically the last step; psychometric properties, norms, references, administration procedure, scoring and interpretation."],
["Role of Experimental Try-out",["Detect weaknesses, omissions, ambiguities and inadequacies of items.","Find the difficulty level of each item and adjust it as required.","Find reliability and validity of the test and of each item.","Determine the time limit.","Decide test length / number of items.","Study inter-correlation and avoid overlapping items.","Identify vague directions or instructions."],"<b>Minimum 3 try-outs:</b><ol><li>Detect gross defects, ambiguities and omissions in items and instructions (N=100).</li><li>Item analysis: difficulty level, discrimination index, effectiveness of distractors.</li><li>Final experimental try-out.</li></ol>"]
],

qb:[["Define psychological testing and explain the characteristics of a good psychological test.",["Both definitions","Features: objective, standardized, limited sample, quantitative/qualitative","O-R-V-N-P with one line each","Conclude: a good test is reliable, valid and normed"]],["What do you mean by psychological testing? Discuss the general steps in test construction.",["Definition and twofold purpose","7 steps in order","Explain try-out, reliability, validity, norms and manual in 2 to 3 lines each"]],["Explain the role of experimental try-out in test construction.",["Purposes list (7 points)","3 stages with N=100 in the first","Item analysis: difficulty, discrimination, distractors"]],["Define psychological testing and discuss classification of psychological tests.",["Definition","Classification is not in your slides; add from textbook: ability/aptitude/achievement, personality, interest, attitude; individual vs group; speed vs power; verbal vs non-verbal"]],["Applications of psychological tests in industrial and clinical settings.",["Not in slides; textbook points: selection, placement, training needs, promotion (industrial); diagnosis, treatment planning, progress evaluation (clinical)"]],["Applications of psychological tests in counselling and educational settings.",["Not in slides; textbook points: career guidance, personal problems (counselling); placement, learning difficulties, giftedness, admission (educational)"]]]},

{n:"Unit 2: Reliability",
notes:[
["Meaning & Significance",["Reliability is an important characteristic of any psychological test.","In simplest sense it is the precision or accuracy of measurement or score; good reliability gives consistent results.","Anastasi & Urbina (1997): consistency of a score when the same persons are re-examined with the same test on different occasions, with different sets of equivalent items, or under other variable conditions.","A test is consistent when examinees keep the same relative ranks on two testings, and those who score high or low on one set of items do the same on an equivalent set.","Temporal stability: consistency over time (test-retest).","Internal consistency: consistency across equivalent sets of items in one administration."],"<b>Error of measurement:</b> reliability lets us predict the range of fluctuation of a single score due to chance factors.<br><b>Error variance:</b> reliability estimates what proportion of total score variance is error variance, meaning any condition irrelevant to the test purpose (mood fluctuation, mindset, rigidity, external factors).<br>Examiners reduce it by controlling environment, instructions, time limits, rapport. Even then no test is perfectly reliable."],
["Correlation Coefficient",["r shows the degree of correspondence between two sets of scores.","Always lies between -1.00 and +1.00.","Positive, negative or zero in nature.","Most common: Pearson Product Moment Correlation, which considers both position in the group and deviation from the group mean.","Raw scores are enough; converting to standard scores is not needed."],"<b>Significance:</b> compare r with critical values at 0.05 and 0.01 using df = N - 2.<br>Example from slides: N=72, df=70, so r must be at least 0.232 (0.05 level) or 0.302 (0.01 level)."],
["Test-Retest Reliability",["Repeat the identical test on a second occasion.","Reliability coefficient = correlation between the two sets of scores of the same persons.","High r means low scorers in the first testing tend to score low in the second.","Shows how far scores generalize over occasions.","Interval is the most important factor: minimum 15 days, maximum 6 months.","Younger children need shorter intervals than older adults."],"<b>Source of error:</b> fluctuation over time, practice and memory effects.<br><b>Exam example:</b> an anxiety scale given to 100 students and again after one month; r = .85 shows good temporal stability."],
["Alternate Form Reliability",["Used to avoid the difficulties of test-retest.","One form on the first occasion and an equivalent form on the second; r between forms is reliability.","Measures both temporal stability and internal consistency.","Always state the interval between administrations.","If forms are given immediately, r shows reliability across forms only, not occasions; error variance is fluctuation from one set to another, not over time."],"<b>Conditions (very important):</b><ul><li>Forms must be truly parallel, independently constructed but with same specifications.</li><li>Same number and form of items, same type of content (verbal, non-verbal, pictorial).</li><li>Equal range and level of difficulty.</li><li>Instructions, time limits, examples and format equivalent.</li></ul>"],
["Split-Half Reliability",["Test is divided into two equal or nearly equal halves; each person gets two scores.","Only one session, so temporal stability does not enter; it is a coefficient of internal consistency.","Most effective split: odd-even method.","The r obtained is for a half test."],"<b>Textbook addition:</b> correct with Spearman-Brown: r(full) = 2r(half) / (1 + r(half)).<br><b>Advantages:</b> one session, no practice effect, no parallel form needed.<br><b>Disadvantages:</b> different splits give different values; unsuitable for speed tests; half-length underestimates reliability without correction."],
["Kuder-Richardson, Alpha & Scorer Reliability",["KR and Coefficient Alpha are internal consistency methods from a single administration.","KR (KR-20, KR-21): for items scored right or wrong.","Cronbach Alpha: general form, works for rating scales such as 1 to 5; computable in MS Excel or SPSS.","Scorer reliability: agreement between two or more scorers, needed when scoring involves judgement."],"<b>Textbook addition:</b> KR-20 = [k/(k-1)] x [1 - (sum of pq)/variance].<br><b>Internal consistency example:</b> in a 20-item test, people who do well on the odd items also do well on the even items, so items measure the same thing.<br><b>Scorer reliability example:</b> two teachers marking the same essays independently; high correlation between their marks shows good scorer reliability."]
],
fc:[["Reliability in one line","Consistency of scores."],["Error variance","Score variance due to factors irrelevant to the test purpose."],["Range of r","-1.00 to +1.00."],["Test-retest interval","15 days to 6 months."],["Temporal stability","Consistency across time."],["Internal consistency","Consistency across items in one administration."],["Best way to split a test","Odd-even."],["KR vs Alpha","KR for right/wrong items; Alpha for any scoring, including rating scales."],["Immediate alternate forms show","Reliability across forms, not occasions."],["df for r","N - 2."],["Scorer reliability","Agreement between scorers."],["Alternate form measures","Both temporal stability and internal consistency."]],
qz:[["Test-retest is also called",["Internal consistency","Temporal stability","Scorer reliability","Face validity"],1],["Recommended maximum test-retest interval",["1 week","1 month","6 months","2 years"],2],["Best method of splitting items",["First half / second half","Odd-even","Random pick","Hardest / easiest"],1],["Split-half involves",["Two sessions","Single session","Three forms","Experts only"],1],["Alternate forms must be",["Identical copies","Truly parallel","Easier","Shorter"],1],["Error variance includes",["Mood fluctuations","True ability","Item content","Norms"],0],["Which is a zero relation?",["Upward scatter","Downward scatter","No pattern in scatter","Perfect line"],2],["Which is suited to rating-scale items?",["KR-20","Cronbach Alpha","Odd-even only","Grade norms"],1],["Minimum test-retest interval",["1 day","15 days","3 months","6 months"],1]],
qb:[["Define reliability and explain test-retest reliability in detail.",["Definition (Anastasi & Urbina)","Procedure and r as coefficient","Interval 15 days to 6 months; age differences","Meaning of high r; error from practice and memory","Example"]],["Explain split-half reliability with advantages and disadvantages.",["Procedure, odd-even method","Single session; internal consistency","Spearman-Brown correction","Pros and cons"]],["What is reliability? Discuss conditions for alternate form reliability.",["Definition","Truly parallel forms and the 4 conditions","Interval statement; immediate vs delayed forms"]],["Kuder-Richardson and Alpha reliability; explain internal consistency with a suitable example.",["Internal consistency meaning","KR for dichotomous, Alpha for rating scales","Excel/SPSS","20-item odd-even example"]],["Define reliability and discuss scorer reliability with a suitable example.",["Definition","Scorer reliability meaning","Two judges marking essays and correlating"]],["What is temporal stability? How is it relevant in a few types of reliability?",["Consistency over time","Test-retest: central","Alternate form (delayed): both","Split-half, KR, Alpha: not involved"]]]},

{n:"Unit 3: Validity",
notes:[
["Meaning of Validity",["Anastasi & Urbina (2002): validity concerns what the test measures and how well it does so; it tells us what can be inferred from scores.","A test is valid to the extent that inferences made from it are appropriate, meaningful and useful.","Reliability is about consistency; validity is about correctness."],"<b>Importance:</b> without validity, scores mislead decisions in selection, placement and treatment.<br><b>Trend in testing:</b> early tests assessed what was learned; then emphasis moved to prediction (selection, placement, treatment); now there is a stronger theoretical orientation and a close link between theory and empirical hypothesis testing.<br><b>Types:</b> content and face; criterion (predictive, concurrent); construct (convergent, discriminant)."],
["Content Validity",["Also known as intrinsic validity, relevance, circular validity, representativeness.","Anastasi: systematic examination of test content to see whether it covers a representative sample of the behaviour domain.","Answers two questions: does the test cover a representative sample of skills and knowledge? Is performance free of irrelevant variables?","Expected in achievement tests; inappropriate for personality and aptitude tests, which resemble their behaviour domain less."],"<b>Procedure:</b><ol><li><b>Expert judgement:</b> items go to subject matter experts who give opinion on relative weightage; validity rests on majority consensus.</li><li><b>Statistical analysis:</b> internal consistency or correlation with an independent test of the same thing. This alone is not a true validity index since both tests might measure the wrong thing.</li></ol>The behaviour domain must be analyzed systematically so all major aspects are covered in correct proportion."],
["Face Validity",["Whether the test looks valid to examinees and to administrators who decide to use it.","Irrelevant, silly or childish looking content leads to poor cooperation, whatever the actual validity.","Affects acceptability in legislative and judicial decisions and public opinion.","A matter of social acceptability, not a technical form of validity.","Improved by rewording items."],"<b>Example:</b> a test for army recruits that uses cartoon-style items may look childish and reduce motivation; rewording items in a job-related way improves face validity without changing what is measured."],
["Criterion Validity",["Very common type: test scores compared with a criterion available now or in the future.","Criterion = an external, independent measure of essentially the same variable the test claims to measure.","Two types: predictive and concurrent."],"<b>Predictive (empirical/statistical) validity:</b> test scores first, criterion obtained after months or years. Needed for long-range forecasts: academic achievement, vocational success, response to therapy. Example: entrance test vs final-year marks.<br><b>Concurrent validity:</b> no time gap. Example: a new intelligence test correlated with marks in a previous examination. If r is very high, the new test may be needless duplication. Suited to diagnosis."],
["Construct Validity",["Term introduced in 1954; more complex than content and criterion validity.","Chosen when neither content nor criterion validity applies.","Also called factorial or trait validity.","Anastasi: the extent to which the test measures a theoretical construct or trait.","Nunnally (1970): a construct is a hypothesis that a variety of behaviours will correlate and be similarly affected by experimental treatments."],"<b>Common steps:</b><ol><li>Specify the different measures of the construct (define it clearly).</li><li>Determine the correlation between all or some of these measures.</li><li>Check whether they act as if measuring the construct.</li></ol><b>Example:</b> Intelligence = quick decisions in complex tasks, operating with symbols and figures, ability to learn, verbal ability, original and critical thinking.<br><b>Convergent:</b> high r with other measures of the same construct (new anxiety scale vs established anxiety scale).<br><b>Discriminant:</b> low r with measures of different constructs (anxiety scale vs vocabulary test)."],
["Validity vs Reliability",["Validity is correlation with an external criterion; reliability is the self-correlation of the test.","Both are dimensions of test efficiency.","A test with poor reliability cannot be expected to be valid; validity depends on reliability.","Slide note: high reliability wants items of equal difficulty, while validity needs items of different difficulty levels."],"<div class='tip'>Archery picture from your slide: tight cluster away from the bullseye = reliable but not valid; cluster on the bullseye = both.</div>"]
],
fc:[["Validity in one line","What a test measures and how well it does so."],["Content validity other names","Intrinsic, relevance, circular, representativeness."],["Content validity unsuitable for","Personality and aptitude tests."],["Two ways to check content validity","Expert judgement and statistical analysis."],["Face validity is","Social acceptability, not technical validity."],["Predictive vs concurrent","Predictive: criterion later. Concurrent: same time."],["Criterion is","External, independent measure of the same variable."],["Construct validity other names","Factorial or trait validity."],["Convergent validity","High correlation with same-construct measures."],["Discriminant validity","Low correlation with different-construct measures."],["Construct validity introduced","1954."],["Validity-reliability link","Poor reliability, not expected to be valid."]],
qz:[["Content validity is most expected in",["Personality tests","Achievement tests","Projective tests","Aptitude tests"],1],["Criterion obtained after a time gap is",["Concurrent","Face","Predictive","Content"],2],["Which is a social acceptability matter?",["Face validity","Construct validity","Criterion validity","Factorial validity"],0],["Construct validity is also called",["Intrinsic validity","Trait validity","Empirical validity","Circular validity"],1],["Concurrent validity involves",["No time gap","Years of gap","Experts only","No criterion"],0],["A test with poor reliability is",["Surely valid","Not expected to be valid","Content valid","Normed"],1],["Convergent validity expects",["Low r with similar tests","High r with same-construct measures","Zero r always","Negative r"],1],["Which uses expert consensus?",["Content validity","Concurrent validity","Predictive validity","Alpha"],0],["Predictive validity is needed for",["Long-range forecasts","Face appearance","Scorer agreement","Splitting items"],0]],
qb:[["Define validity and explain its importance in any psychological test.",["Anastasi & Urbina definition","Inferences: appropriate, meaningful, useful","Link with reliability","Types in brief"]],["Explain the procedure of content validity along with its types.",["Definition and other names","Expert judgement","Statistical analysis","Two questions it answers; suited to achievement tests"]],["What is face validity? Why is it necessary? Explain with examples.",["Looks valid to examinees","Cooperation, legal and public acceptance","Not technical","Reword items; example"]],["Common steps used to explore construct validity.",["Specify measures of the construct","Correlate them","Check they behave as the construct","Intelligence example"]],["Discuss criterion validity and its types with appropriate examples.",["Criterion definition","Predictive with example","Concurrent with example","Very high r means duplication"]],["What is construct validity? Explain convergent and discriminant validity with suitable examples.",["Definition (Anastasi, Nunnally)","Convergent example","Discriminant example","Why used when content/criterion not applicable"]]]},

{n:"Norms",
notes:[
["Meaning & Significance",["Raw scores convey no meaning in themselves; they come in different units.","Example: 40 in Arithmetic Reasoning and 30 in Vocabulary cannot be compared directly.","Norms = average performance on a test by the standardization sample, a true representative of the population.","Raw scores become derived scores that show relative position and allow comparison across tests and with others."],"<b>Steps in developing norms:</b> define the target population, select the sample, standardize conditions of administration."],
["Norm- vs Criterion-referenced",["Norm-referenced: score compared with a specific group of examinees on that test.","Criterion-referenced: score explained by an external standard or criterion.","Criterion-referenced tests always rely on a predetermined cut-off; norm-referenced tests rely on a normative group."]],
["Developmental Norms",["Show how far along the normal developmental path a person has progressed.","Age-equivalent norms: average performance of a representative sample of an age level; best for traits increasing systematically with age (height, weight, general intelligence, psychomotor skills).","Grade-equivalent norms: mean raw score of children in each grade; used for educational achievement tests.","Example: 4th graders average 23 problems, so raw 23 = grade equivalent 4."],"<b>Disadvantages of age norms:</b> psychometrically crude; hard for statistical treatment; no uniform unit across growth; growth rate differs by age and trait (maze learning vs vocabulary).<br><b>Disadvantages of grade norms:</b> instruction content varies by grade so suited only to common subjects; unsuitable for high school where progress differs across subjects."],
["Within-Group Norms",["Performance judged against the most nearly comparable standardization group.","Uniform and clearly defined, so quantitative meaning works in most statistical analysis.","Types: percentile, standard score, normalized standard score, deviation IQ."]],
["Percentile",["Shows relative position in the standardization sample.","Like ranks in a group of 100, but counted from the bottom: lower percentile = poorer performance.","Percentage of people who fall below a given score.","Example: if 28% got fewer than 15 correct, raw 15 = 28th percentile.","50th = median; 25th = Q1; 75th = Q3."],"<b>Advantages:</b> easy to compute, understood even by untrained persons, universally applicable."],
["Standard Scores & Normalized Scores",["Standard score has a fixed mean and fixed SD; equal units whose size does not vary between distributions.","Needed to compare the same individual across different tests.","z (sigma) score = (X - M) / SD.","Other types: T score, stanine, deviation IQ.","Normalized standard scores: distribution transformed to normal; mean 0, SD 1; can be put in any convenient form.","T score = 50 + 10z; T 50 = mean, T 60 = 1 SD above."],"<b>Related statistics:</b> frequency distribution (cases in each class interval), histogram, mean (average), mode (most frequent), median (middlemost), variability.<br><b>Worked example:</b> X=65, M=50, SD=10 gives z=1.5 and T=65."]
],

let ui=0,mode="learn",fi=0,flip=false,qs={};
const $=s=>document.querySelector(s);
const MODES=[["learn","Learn","book"],["revise","Revise","loop"],["quiz","Quiz","target"],["qb","Q-Bank","pen"]];
function nav(){$("#units").innerHTML=U.map((u,i)=>`<button class="${i==ui?'on':''}" onclick="ui=${i};fi=0;flip=false;qs={};nav()">${ic(IC[(i*2)%8])}${u.n.split(":")[0]}</button>`).join("");
$("#modes").innerHTML=MODES.map(m=>`<button class="${m[0]==mode?'on':''}" onclick="mode='${m[0]}';nav()">${ic(m[2])}${m[1]}</button>`).join("");draw()}
function draw(){const u=U[ui];let h=`<h2>${u.n}</h2>`;
if(mode=="learn")h+=u.notes.map((n,i)=>`<div class="card"><svg class="corner"><use href="#${IC[(i+3)%8]}"/></svg><h3>${ic(0,i)}${n[0]}</h3><ul>${n[1].map(x=>`<li>${x}</li>`).join("")}</ul>${n[2]?`<details><summary>Detailed section</summary><p>${n[2]}</p></details>`:""}</div>`).join("");
if(mode=="revise")h+=`<div class="bar"><i style="width:${(fi+1)/u.fc.length*100}%"></i></div><p class="tag">Card ${fi+1} of ${u.fc.length}. Tap the card to flip.</p><div class="fc" onclick="flip=!flip;draw()">${flip?ic("bulb")+u.fc[fi][1]:ic("star")+u.fc[fi][0]}</div><div class="row"><button onclick="fi=(fi-1+${u.fc.length})%${u.fc.length};flip=false;draw()">Prev</button><button onclick="fi=(fi+1)%${u.fc.length};flip=false;draw()">Next</button></div><div class="card"><h3>${ic("flower")}Quick revision sheet</h3><ul>${u.fc.map(f=>`<li><b>${f[0]}:</b> ${f[1]}</li>`).join("")}</ul></div>`;
if(mode=="quiz"){const d=Object.keys(qs).length,sc=Object.entries(qs).filter(([k,v])=>v==u.qz[k][2]).length;
h+=`<p><span class="pill">Score ${sc}/${d}</span> <span class="tag">${u.qz.length} questions</span> ${d==u.qz.length?(sc==u.qz.length?"Perfect, wow!":"Retry the wrong ones!"):""}</p>`+u.qz.map((q,i)=>`<div class="card"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>{let c="";if(i in qs){if(j==q[2])c="ok";else if(j==qs[i])c="bad"}return`<button class="opt ${c}" onclick="ans(${i},${j})">${o}</button>`}).join("")}</div>`).join("")+`<div class="row"><button onclick="qs={};draw()">${ic("loop")}Reset quiz</button></div>`}
if(mode=="qb")h+=`<p class="tag">Likely questions from your question bank, with answer outlines.</p>`+u.qb.map((q,i)=>`<div class="card"><b>${ic("pen")}Q${i+1}. ${q[0]}</b><details><summary>Answer outline</summary><ul>${q[1].map(x=>`<li>${x}</li>`).join("")}</ul></details></div>`).join("");
$("#view").innerHTML=h}
function ans(i,j){if(i in qs)return;qs[i]=j;draw()}
nav();
</script></body></html>
